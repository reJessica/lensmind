# 复制为 ai-local.properties（Git 已忽略），在本机填写。
lensmind.api-key=
lensmind.uniapi-key=
# 默认 MOCK 不调用外部 API；真实调用时再启用：
# lensmind.ai.mode=LIVE
# lensmind.ai.chat.model=qwen3.5-27b
# UniAPI 语音（与原有文字模型密钥分开）：
# lensmind.ai.asr.url=https://api.uniapi.io/v1/audio/transcriptions
# lensmind.ai.asr.model=whisper-1
# lensmind.ai.asr-protocol=OPENAI_AUDIO
# lensmind.ai.tts.url=https://api.uniapi.io/v1/audio/speech
# lensmind.ai.tts.model=tts-1
# lensmind.ai.tts-protocol=OPENAI_AUDIO
# lensmind.ai.voice=alloy
# 语音需要另外提供的服务，不默认复用文字模型的密钥或平台：
# lensmind.asr-api-key=
# lensmind.tts-api-key=
# 若切换 Qwen ASR，将 asr-protocol 改为 QWEN_CHAT，并配置其 chat/completions 地址。
# 若使用百炼原生 Qwen TTS，tts-protocol 改为 DASHSCOPE，配置 generation 地址、模型与音色。
# 默认每次进程最多尝试 50 次真实调用，LLM 与 TTS 共用，无自动重试；不是金额预算。
# 可通过本项或环境变量 LENSMIND_MAX_LIVE_CALLS 调整，修改后重启生效。
# lensmind.ai.max-live-calls=50
