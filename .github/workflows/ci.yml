name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check crop boundaries and command semantics
        run: node --test tests/frontend.test.mjs
