name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check crop boundaries and command semantics
        run: node --test tests/frontend.test.mjs tests/assistant-voice.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local ASR protocol without downloading weights
        run: |
          python -m pip install -r asr/requirements.txt
          python -m unittest discover -s asr -p 'test_*.py'
