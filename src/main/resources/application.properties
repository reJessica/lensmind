spring.application.name=lensmind
server.port=${PORT:8080}
server.address=${HOST:127.0.0.1}
spring.web.error.include-message=always
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.use-last-modified=false
lensmind.device.backend=${LENSMIND_DEVICE_BACKEND:mock}
lensmind.mujoco.port=${LENSMIND_MUJOCO_PORT:8765}
lensmind.local-asr.port=${LENSMIND_LOCAL_ASR_PORT:9001}
lensmind.local-asr.auto-start=${LENSMIND_ASR_AUTO_START:true}
lensmind.local-asr.python=${LENSMIND_ASR_PYTHON:}
lensmind.local-asr.project-dir=${LENSMIND_ASR_PROJECT_DIR:.}
lensmind.calibration.required=${LENSMIND_CALIBRATION_REQUIRED:false}
lensmind.calibration.port=${LENSMIND_CALIBRATION_PORT:}
lensmind.calibration.file=${LENSMIND_CALIBRATION_FILE:}
lensmind.calibration.python=${LENSMIND_CALIBRATION_PYTHON:python}
lensmind.calibration.resume-sha256=${LENSMIND_CALIBRATION_RESUME_SHA256:}
lensmind.camera.wrist-label=${LENSMIND_WRIST_CAMERA_LABEL:}
lensmind.so101.bridge-port=${LENSMIND_SO101_BRIDGE_PORT:8767}
lensmind.so101.token=${LENSMIND_SO101_TOKEN:}

spring.config.import=optional:file:./config/ai-local.properties
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# MOCK 不产生外部调用。仅显式切换 LIVE 后才读取供应商配置。
lensmind.ai.mode=${LENSMIND_AI_MODE:MOCK}
lensmind.ai.max-live-calls=${LENSMIND_MAX_LIVE_CALLS:50}
lensmind.ai.timeout-seconds=${LENSMIND_AI_TIMEOUT:60}
lensmind.ai.chat.url=${LENSMIND_CHAT_URL:https://zgc.apihy.com/v1/chat/completions}
lensmind.ai.chat.model=${LENSMIND_CHAT_MODEL:qwen3.5-27b}
lensmind.ai.chat.api-key=${LENSMIND_CHAT_API_KEY:${LENSMIND_API_KEY:${lensmind.api-key:}}}
lensmind.ai.asr.url=${LENSMIND_ASR_URL:https://api.uniapi.io/v1/audio/transcriptions}
lensmind.ai.asr.model=${LENSMIND_ASR_MODEL:whisper-1}
lensmind.ai.asr.api-key=${LENSMIND_ASR_API_KEY:${lensmind.asr-api-key:${LENSMIND_UNIAPI_KEY:${lensmind.uniapi-key:}}}}
lensmind.ai.tts.url=${LENSMIND_TTS_URL:https://api.uniapi.io/v1/audio/speech}
lensmind.ai.tts.model=${LENSMIND_TTS_MODEL:tts-1}
lensmind.ai.tts.api-key=${LENSMIND_TTS_API_KEY:${lensmind.tts-api-key:${LENSMIND_UNIAPI_KEY:${lensmind.uniapi-key:}}}}
lensmind.ai.asr-protocol=${LENSMIND_ASR_PROTOCOL:OPENAI_AUDIO}
lensmind.ai.tts-protocol=${LENSMIND_TTS_PROTOCOL:OPENAI_AUDIO}
lensmind.ai.voice=${LENSMIND_TTS_VOICE:alloy}
lensmind.ai.thinking=${LENSMIND_ENABLE_THINKING:false}
lensmind.ai.json-mode=${LENSMIND_JSON_MODE:false}

server.error.include-message=always
server.servlet.session.persistent=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
lensmind.vision.model=${LENSMIND_VISION_MODEL:models/ssd_mobilenet_v1_12.onnx}
lensmind.vision.face-model=${LENSMIND_FACE_MODEL:models/face_detection_yunet_2026may.onnx}
lensmind.vision.pose-model=${LENSMIND_POSE_MODEL:models/pose_estimation_mediapipe_2023mar.onnx}
lensmind.ai.allowed-hosts=${LENSMIND_AI_ALLOWED_HOSTS:api.openai.com,openrouter.ai,api.siliconflow.cn,dashscope.aliyuncs.com,models.sjtu.edu.cn,zgc.apihy.com,api.uniapi.io}
